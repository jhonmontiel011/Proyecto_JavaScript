
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Mahathan Quiz</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="login-container">

        <form class="login-form" id="formLogin">

            <a href="../index.html" class="volver">← Volver</a>

            <p class="etiqueta">BIENVENIDO DE NUEVO</p>

            <h1>Iniciar sesión</h1>

            <p class="subtitulo">
                Ingresa a tu cuenta de Mahathan Quiz.
            </p>

            <div class="campo">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="mahathan6606@gmail.com" required>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" placeholder="Ingresa tu contraseña" required>
            </div>

            <button type="submit" class="btn-login">
                INICIAR SESIÓN
            </button>

            <p id="mensaje"></p>

            <p class="registro-link">
                ¿Todavía no tienes cuenta de Mahathan?
                <a href="registro.html">Regístrate</a>
            </p>

        </form>

    </main>

    <script src="../js/login.js"></script>

</body>
</html>
